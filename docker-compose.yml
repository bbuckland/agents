services:
  openclaw:
    build: ./openclaw
    image: openclaw-custom:latest
    ports:
      - "18789:18789"
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GH_TOKEN: ${GH_TOKEN}
      GITHUB_TOKEN: ${GH_TOKEN}
      TELEGRAM_BUCKBOT_TOKEN: ${TELEGRAM_BUCKBOT_TOKEN}
      TELEGRAM_EXPENSE_TOKEN: ${TELEGRAM_EXPENSE_TOKEN}
      TELEGRAM_QUANT_TOKEN: ${TELEGRAM_QUANT_TOKEN}
    volumes:
      - openclaw-state:/home/node/.openclaw
      - ./openclaw/skills:/home/node/skills:ro
      - ${OPENCLAW_WORKSPACE_DIR:-./workspace}:/home/node/workspace
      - ./openclaw/workspaces:/home/node/workspaces
    init: true
    restart: unless-stopped
    depends_on:
      - quant-trading
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "loopback",
        "--port",
        "18789"
      ]

  quant-trading:
    build: ./quant-trading
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/quant
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  openclaw-state:
  postgres-data:
